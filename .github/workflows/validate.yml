name: Validate skill pack

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check referenced files
        shell: bash
        run: |
          set -euo pipefail
          grep -ohE 'references/[A-Za-z0-9._/-]+\\.md|templates/[A-Za-z0-9._/-]+' README.md SKILL.md \
            | sort -u \
            | while read -r path; do
                test -e "$path" || { echo "Missing referenced path: $path"; exit 1; }
              done
      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck 1.2.0
      - name: Lua syntax check
        shell: bash
        run: |
          set -euo pipefail
          find templates -type f -name '*.lua' -print0 \
            | xargs -0 -r -n1 luac5.4 -p
      - name: Lua lint report
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luacheck "$file" --no-max-line-length --no-unused-args || {
              status=$?
              # Template scaffolds intentionally contain warnings for FiveM globals,
              # manifest directives, and placeholder sections. Syntax is gated above.
              if [ "$status" -gt 1 ]; then
                echo "::warning::Luacheck fatal/configuration result ($status) in $file"
                failed=1
              fi
            }
          done < <(find templates -type f -name '*.lua' -print0)
          exit "$failed"
