name: Validate skill pack

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check referenced files
        shell: bash
        run: |
          set -euo pipefail
          grep -ohE 'references/[A-Za-z0-9._/-]+\\.md|templates/[A-Za-z0-9._/-]+' README.md SKILL.md \
            | sort -u \
            | while read -r path; do
                test -e "$path" || { echo "Missing referenced path: $path"; exit 1; }
              done
      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck 1.2.0
      - name: Lua syntax check
        shell: bash
        run: |
          set -euo pipefail
          find templates -type f -name '*.lua' -print0 \
            | xargs -0 -r -n1 luac5.4 -p
      - name: Markdown Lua block syntax check
        shell: bash
        run: python3 scripts/check_lua_blocks.py luac5.4
      - name: Lua lint
        shell: bash
        # FiveM globals and template allowances live in .luacheckrc; any warning fails the build.
        run: luacheck templates
